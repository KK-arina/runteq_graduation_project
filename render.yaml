# ==============================================================================
# render.yaml - Render の設定（Blueprint）
# ==============================================================================
#
# 【このファイルの位置づけ（2026-11-28 時点）】
#   Render の Blueprint「habitflow」が、このファイルと main ブランチを結び付けている。
#   ただし Blueprint の Auto Sync は「No」にしてあり、このファイルを変えても
#   Render の設定は自動では変わらない。実際の設定は Render の画面が正しい。
#   このファイルは「Render の画面の設定と同じ内容」を記録しておくためのもの。
#
# 【Manual Sync を押すときの注意】
#   Render の画面で Manual Sync を押すと、このファイルの内容で設定が上書きされる。
#   押す前に、表示される差分（変わる項目）を必ず確かめる。
#   以前はこのファイルに startCommand（Docker のサービスでは使えない項目）や
#   region: singapore（作成後は変えられない項目）が書いてあり、同期が失敗していた。
#
# 【構成】
#   Web サービス1つだけ。GoodJob は execution_mode: :async で Web プロセスの中で動かすため、
#   Worker サービスは使わない（Render の Free プランでは Background Worker が使えないため）。
#
# 【起動の流れ】
#   Dockerfile の ENTRYPOINT（bin/docker-entrypoint）が db:migrate などの準備をしたあと、
#   CMD（./bin/rails server -b 0.0.0.0）でサーバーを起動する。
#   dockerCommand を書かないと Dockerfile の CMD が使われる（Render の画面の Docker Command も空欄）。
#   参考: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: habitflow-web
    runtime: docker
    # region は作成後に変えられない。実際のサービスは Oregon（DB の Neon も AWS US West 2 (Oregon)）
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # main へのコミット（push）ごとに自動でデプロイする（画面の Auto-Deploy: On Commit と同じ）
    autoDeployTrigger: commit

    # 環境変数
    #   value を書いたもの … 秘密ではない設定値
    #   sync: false        … 秘密の値。Render の画面（Environment）で値だけを入れる。GitHub には書かない
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      # true にすると、起動のたびに db:seed（習慣テンプレートの読み込み）を行う。ふだんは false
      - key: SEED_IN_PRODUCTION
        value: "false"

      - key: RAILS_MASTER_KEY
        sync: false
      # Neon（PostgreSQL）への接続文字列
      - key: DATABASE_URL
        sync: false
      # メール送信（Resend）
      - key: RESEND_API_KEY
        sync: false
      # AI 分析（まず Gemini、失敗したら Groq）
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Google ログイン
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # LINE ログイン（LINE Login チャネル）
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      # LINE 通知（Messaging API チャネル）
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      # /good_job（ジョブの管理画面）の Basic 認証
      - key: GOOD_JOB_LOGIN
        sync: false
      - key: GOOD_JOB_PASSWORD
        sync: false
      # エラー監視（Sentry）。設定されているときだけ有効になる
      - key: SENTRY_DSN
        sync: false
      # 管理画面（/admin）を開けるメールアドレス（カンマ区切り）
      - key: ADMIN_EMAILS
        sync: false
