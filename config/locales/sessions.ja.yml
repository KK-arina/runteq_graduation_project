# config/locales/sessions.ja.yml
#
# ==============================================================================
# ログイン・ログアウト（SessionsController）の文言
# ==============================================================================
#
# 【このファイルを分けた理由】
#   ja.yml には sessions: のキーがまだ無く、機能ごとにファイルを分ける方針
#   （remember_login.ja.yml / pwa_install.ja.yml と同じ）に合わせる。
#   Rails は config/locales/ 直下の *.yml を自動で読み込むので、設定の追加は不要。
#
# 【使っている場所】
#   sessions.destroy.stale_page … SessionsController#handle_invalid_authenticity_token
#     古い画面（CSRF トークンが古い）からログアウトを押したときに、黄色の ⚠️ で表示する。
# ==============================================================================
ja:
  sessions:
    destroy:
      stale_page: "画面の情報が古くなっていたため、ログアウトできませんでした。もう一度「ログアウト」を押してください。"