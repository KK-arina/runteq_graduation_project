# config/locales/pwa_install.ja.yml
#
# ==============================================================================
# ホーム画面に追加（PWA）の案内文
# ==============================================================================
#
# 【このファイルを分けた理由】
#   ja.yml は機能が増えて長くなっているため、remember_login.ja.yml と同じように
#   機能ごとにファイルを分けて、探しやすく・直しやすくする。
#   Rails は config/locales/ 直下の *.yml を自動で読み込むので、設定の追加は不要。
#
# 【使っている場所】
#   pwa_install.guide.*  … app/views/settings/_pwa_install_guide.html.erb（設定ページの案内カード）
#   pwa_install.login.*  … app/views/shared/_pwa_login_notice.html.erb（ログイン画面の注意書き）
#
# 【steps: の書き方（- で始まる行）】
#   YAML の配列。ビューで t("...steps") を呼ぶと Ruby の配列が返り、
#   each で1行ずつ番号付きリスト（<ol>）にする。
#
# 【文中の「」について】
#   文字列全体を "..." で囲んでいるので、中の「」や（）はそのまま書いてよい。
#   ただし半角の " を文中に使うと文字列が途中で終わるため使わない。
# ==============================================================================
ja:
  pwa_install:
    guide:
      title: "ホーム画面に追加する"
      lead: "HabitFlow をホーム画面に追加すると、アプリのようにアイコンから1タップで開けます。"
      your_device: "お使いの端末"

      # Chrome / Edge で表示する「インストール」ボタン
      install_button: "この端末にインストールする"
      install_hint: "Chrome / Edge では、このボタンからホーム画面（パソコンではデスクトップやスタートメニュー）に追加できます。"

      # ホーム画面から初めて開いたときのログインの案内（すべての端末で表示）
      first_login:
        title: "ホーム画面から初めて開いたときのログイン"
        body: "「ログインしたままにする」にチェックを入れてログインしてください。チェックしないと、アプリを閉じるたびにログアウトされます。"

      # ホーム画面から開いているときの表示
      standalone:
        title: "ホーム画面から開いています"
        remembered: "この端末ではログインを保持しています。次回もログインなしで開けます。"
        not_remembered: "この端末ではログインを保持していません。アプリを閉じるとログアウトされます。このページの「ログインの保持」で「この端末でログインを保持する」を押してください。"

      # iPhone / iPad（Safari）
      ios:
        summary: "iPhone / iPad（Safari）"
        steps:
          - "Safari でこのページを開き、「ログインしたままにする」にチェックを入れてログインしておきます（Google / LINE でログインする場合も、ここで済ませておきます）。"
          - "共有ボタン（四角から上向きの矢印が出ているアイコン）をタップします。見つからない場合は、アドレスバーの横の「…」ボタンの中を探してください。"
          - "メニューを下にスクロールして「ホーム画面に追加」をタップします。"
          - "「Webアプリとして開く」がオンになっていることを確認して、「追加」をタップします。"
        note: "iPhone のホーム画面アプリは、Safari とログイン情報が別々に保存されます。Safari でログインしてから追加すると、そのログイン状態がホーム画面アプリにも引き継がれます（iOS 17.2 以降）。ホーム画面アプリの中で Google / LINE ログインが完了しない場合は、Safari でログインし直してから、ホーム画面のアイコンを削除して追加し直してください。"

      # Android（Chrome）
      android:
        summary: "Android（Chrome）"
        steps:
          - "Chrome でこのページを開きます。"
          - "上の「この端末にインストールする」ボタンが表示されていればタップします。表示されていない場合は、右上の「︙」メニューから「ホーム画面に追加」または「アプリをインストール」をタップします。"
          - "「インストール」をタップすると、ホーム画面に HabitFlow のアイコンが追加されます。"
        note: "Android のホーム画面アプリは Chrome とログイン情報を共有します。Chrome で「ログインしたままにする」にチェックしてログインしていれば、そのまま使えます。"

      # パソコン（Chrome / Edge / Mac の Safari）
      desktop:
        summary: "パソコン（Chrome / Edge / Mac の Safari）"
        steps:
          - "Chrome: アドレスバーの右端にあるインストールのアイコンをクリックします。見つからない場合は、右上の「︙」から「キャスト、保存、共有」→「ページをアプリとしてインストール」を選びます。"
          - "Edge: 右上の「…」から「アプリ」→「このサイトをアプリとしてインストール」を選びます。"
          - "Mac の Safari: メニューバーの「ファイル」→「Dock に追加」を選びます。"
        note: "インストールすると、スタートメニューや Dock から HabitFlow を専用のウィンドウで開けます。"

      # LINE などのアプリ内ブラウザ
      inapp:
        summary: "LINE などのアプリの中で開いている場合"
        steps:
          - "LINE などのアプリの中のブラウザでは、ホーム画面に追加できません。まず Safari（iPhone）または Chrome（Android）で開き直します。"
          - "下の「Safari / Chrome で開く」をタップします。"
          - "開き直せない場合は、iPhone では画面の共有ボタンや「︙」から「Safari で開く」を、Android では右上の「︙」から「ブラウザで開く」（または「他のアプリで開く」）を選びます。表示はアプリのバージョンによって異なります。"
          - "Safari / Chrome で開いたら、上の iPhone または Android の手順に進みます。"
        open_external: "Safari / Chrome で開く"
        note: "Safari / Chrome で開いたときはログインしていない状態になります。「ログインしたままにする」にチェックを入れてログインしてください。"

    # ログイン画面の注意書き（ホーム画面から開いているときだけ表示）
    login:
      remember_hint: "ホーム画面アプリでは「ログインしたままにする」にチェックを入れてログインしてください。チェックしないと、アプリを閉じるたびにログアウトされます。"
      ios_oauth_hint: "iPhone のホーム画面アプリでは、Google / LINE ログインが Safari 側で開き、ログインが完了しないことがあります。その場合は、Safari で「ログインしたままにする」にチェックを入れてログインしてから、ホーム画面のアイコンを削除して追加し直してください。"

    # ダッシュボードのバナー（app/views/dashboards/_install_banner.html.erb）
    #   ブラウザで開いていて、まだ ✕ で閉じていないときだけ表示する
    banner:
      title: "HabitFlow をホーム画面に追加しませんか？"
      body: "アイコンから1タップで開けるようになり、毎日の記録がかんたんになります。"
      how_to: "追加のしかたを見る"
      install_button: "今すぐ追加する"
      dismiss: "この案内を閉じる"
