# config/locales/remember_login.ja.yml
#
# ==============================================================================
# ログイン保持（remember me）関連の日本語メッセージ
# ==============================================================================
#
# 【なぜ ja.yml ではなく別ファイルにするのか】
#   config/locales/ に置いた .yml は Rails が自動ですべて読み込むため、
#   別ファイルでも t("remember_login.form.label") のように呼び出せる。
#   既存の ja.yml は大きく、settings: などのキーを2回書くと
#   前の定義が消えてしまう（YAML のルール）。
#   機能ごとにファイルを分けることで、既存の文言を壊す心配をなくす。
#
# 【新しいファイルを追加したあとの注意】
#   読み込むファイルの一覧は Rails の起動時に決まるため、
#   追加後は docker compose restart web でサーバーを再起動する。
#
# 【YAML のルール】インデントはスペースのみ（タブ文字は禁止）
# ==============================================================================

ja:
  remember_login:
    # ── ログイン画面（sessions/new.html.erb）──
    form:
      label: "ログインしたままにする"
      hint: "ブラウザを閉じても30日間ログインしたままになります（使うたびに延長・最長180日）。共用のパソコンではチェックしないでください。"

    # ── 設定画面（settings/show.html.erb）のログイン保持セクション ──
    settings:
      title: "ログインの保持"
      description: "「ログインしたままにする」をオンにした端末では、ブラウザを閉じても30日間ログインしたままになります（使うたびに延長・最長180日）。"
      this_device_on: "この端末：ログインを保持中"
      this_device_off: "この端末：ログインを保持していません"
      device_count: "ログインを保持している端末：%{count}台"
      enable_button: "この端末でログインを保持する"
      disable_button: "この端末のログイン保持をやめる"
      revoke_all_button: "すべての端末からログアウトする"
      revoke_all_hint: "スマホを紛失したときなどに使います。すべての端末のログイン保持を解除し、この端末以外のログインも終了します。"
      revoke_all_confirm: "すべての端末のログイン保持を解除し、ほかの端末をログアウトさせます。よろしいですか？"

    # ── 設定画面の操作後に表示するメッセージ ──
    flash:
      enabled: "この端末でログインを保持するように設定しました。"
      already_enabled: "この端末はすでにログインを保持しています。"
      disabled: "この端末のログイン保持をやめました。"
      revoked_all: "すべての端末のログイン保持を解除し、ほかの端末をログアウトさせました。"