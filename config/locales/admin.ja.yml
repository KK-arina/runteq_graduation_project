# config/locales/admin.ja.yml
#
# ==============================================================================
# 管理画面（/admin）の日本語メッセージ
# ==============================================================================
#
# 【なぜ ja.yml ではなく別ファイルにするのか】
#   既存の ja.yml は大きく、同じキーを2回書くと前の定義が消えてしまう（YAML のルール）。
#   remember_login.ja.yml などと同じく、機能ごとにファイルを分ける。
#
# 【ビューの t(".title") の書き方（遅延ルックアップ）】
#   app/views/admin/dashboards/show.html.erb の中で t(".title") と書くと、
#   Rails がファイルの場所から admin.dashboards.show.title を探す。
#
# 【新しいファイルを追加したあとの注意】
#   読み込むファイルの一覧は Rails の起動時に決まるため、
#   ブラウザで確認する前に docker compose restart web でサーバーを再起動する。
#
# 【YAML のルール】インデントはスペースのみ（タブ文字は禁止）
# ==============================================================================

ja:
  admin:
    # ── 再ログインの案内（admin/reauth.html.erb）──
    reauth:
      page_title: "もう一度ログインしてください | HabitFlow"
      title: "もう一度ログインしてください"
      description: "安全のため、管理画面は「ログイン画面からログインして%{hours}時間以内」のときだけ開けます。「ログインしたままにする」で自動的にログインしている状態では開けません。"
      note: "ログアウトすると、この端末の「ログインしたままにする」も解除されます。ログインするときにもう一度チェックし、ログイン後にもう一度管理画面を開いてください。"
      logout_button: "ログアウトしてログインし直す"

    # ── ログイン方法（users.provider の値）の表示名 ──
    providers:
      email: "メール"
      google_oauth2: "Google"
      line_v2_1: "LINE"
      line: "LINE"
      other: "その他"

    # ── 管理画面のトップ（admin/dashboards/show.html.erb）──
    dashboards:
      show:
        page_title: "利用状況の管理画面 | HabitFlow"
        title: "利用状況の管理画面"
        generated_at: "集計日時: %{time}（%{minutes}分ごとに集計し直します）"
        excluded_note: "退会済みのユーザー・デモ／テスト用アカウント（example.com など）・管理者自身は数えていません。入力内容（振り返りのコメント・目標・メモ）は表示しません。"
        sections:
          users: "ユーザー"
          usage: "利用量"
          connections: "連携"
          charts: "週ごとの推移（直近12週）"
          funnel: "どこで離脱しているか"
          providers: "ログイン方法の内訳"
        stats:
          total_users: "登録ユーザー"
          active_7d: "直近7日に利用"
          active_30d: "直近30日に利用"
          onboarding: "オンボーディング通過"
          pmvv: "PMVV を登録"
          habits_active: "使用中の習慣"
          habit_records: "習慣の記録（累計）"
          habit_records_7d: "習慣の記録（直近7日）"
          reflections: "振り返りの完了"
          reflections_without_ai: "AI なしで完了"
          ai_analyses: "AI 分析の実行"
          line_connected: "LINE 連携"
          line_notification: "LINE 通知 ON"
          remember: "ログイン保持中"
        units:
          people: "%{count}人"
          items: "%{count}件"
          people_with_rate: "%{count}人（%{rate}%）"
          completed_of_total: "%{completed} / %{total}件（%{rate}%）"
        charts:
          signups: "新規登録"
          recording_users: "習慣を記録した人数"
          signups_aria: "週ごとの新規登録数のグラフ（直近12週）"
          recording_users_aria: "週ごとの習慣を記録した人数のグラフ（直近12週）"
        funnel_note: "（ ）内は、登録した人に対する割合です。"
        funnel_steps:
          registered: "登録"
          onboarding_passed: "オンボーディング通過（完了またはスキップ）"
          habit_created: "習慣を作成"
          first_record: "初めて記録"
          recorded_7_days: "7日以上記録"
          reflection_completed: "振り返りを完了"
