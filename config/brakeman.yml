---
# ==============================================================================
# Brakeman 設定ファイル
#   brakeman 実行時に config/brakeman.yml を自動で読み込む（-c 指定は不要）。
# ==============================================================================
#
# 【EOLRails チェックを除外する理由】
#   EOLRails は「使用中の Rails のサポート期限が近い」ことを知らせる
#   依存ライブラリの寿命告知であり、コードの脆弱性ではない。
#   本アプリは Rails 7.2.3（公式セキュリティサポートは 2026-08-09 まで /
#   rubyonrails.org/maintenance で確認）で稼働している。
#   #I-2 セキュリティ監査では、Brakeman -A（CheckUnscopedFind 等の追加チェック込み）
#   でコード側の脆弱性が 0 件であることを確認済み。
#   卒業制作の安定リリースを最優先し、フレームワーク本体の大型更新（Rails 8 系）は
#   本リリース後の独立タスクとして実施する（README「今後の予定」に記載）。
#
# 【重要・将来の TODO】
#   Rails 8.0 / 8.1 へアップグレードした後は、下の skip_checks から CheckEOLRails を外し、
#   EOLRails チェックを再び有効化すること（新バージョンの EOL も監視するため）。
#
# 【名前の注意】
#   CLI の --except は "EOLRails" でも通るが、YAML の skip_checks は名前を
#   正規化しないため、必ずクラス名 "CheckEOLRails"（Check 付き）で書く。
# ==============================================================================
:skip_checks:
  - CheckEOLRails