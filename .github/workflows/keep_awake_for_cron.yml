# .github/workflows/keep_awake_for_cron.yml
#
# 【このワークフローの役割】
#   Render の無料プランは、15 分アクセスが無いとアプリを止める。
#   GoodJob の cron（config/initializers/good_job.rb）はアプリの中で動くため、
#   予定の時刻にアプリが止まっていると、そのジョブは実行されない（あとから実行し直すこともない）。
#   そこで、予定の時間帯だけ、アプリの /up（Rails の起動確認用 URL）に 4 分おきにアクセスして起こし続ける。
#
# 【なぜ 24 時間起こし続けないのか】
#   アプリが起きている間は GoodJob が 30 秒ごとに DB を確認するので、Neon も止まらない。
#   24 時間だと 0.25 CU × 24 時間 × 30 日 ≒ 180 CU 時間になり、Neon 無料プランの月 100 CU 時間を超える。
#   予定の時間帯だけ（1 日約 2.5 時間）にすることで、無料枠に収める。
#
# 【時刻はすべて UTC】GitHub Actions の schedule は UTC で書く（日本時間 = UTC + 9 時間）。
#   毎時 0 分は GitHub Actions が混み合って遅れやすいため、開始を 0 分からずらしている。
#   遅れても間に合うように、予定の約 40 分前から起こし始める。
#
# 【注意】公開リポジトリでは、リポジトリに 60 日間更新が無いと、定期実行が自動で止まる。
#   止まった場合は、GitHub の Actions タブから有効にし直す。

name: Keep Render awake for GoodJob cron

on:
  schedule:
    # ① 14:17〜15:10 UTC（日本時間 23:17〜0:10）
    #    0:00 の AI 使用回数リセット、0:05 の通知回数リセット
    - cron: "17 14 * * *"
    # ② 18:23〜19:20 UTC（日本時間 3:23〜4:20）
    #    4:05 のストリーク計算、4:10 のお休みモード解除、4:15 の AI プロファイル更新（月曜）
    - cron: "23 18 * * *"
    # ③ 日曜 23:17〜月曜 0:05 UTC（日本時間 月曜 8:17〜9:05）
    #    9:00 の週次レポートメール
    - cron: "17 23 * * 0"
  # Actions タブから手動で試せるようにする（手動のときは 20 分だけ起こす）
  workflow_dispatch:

# このワークフローはリポジトリの中身を読まないので、GitHub のトークンに権限を一切与えない
permissions: {}

# 同じワークフローが重なって動かないようにする（前の回が終わるまで次の回は待つ）
concurrency:
  group: keep-awake-for-cron
  cancel-in-progress: false

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    # 一番長い ②（約 1 時間）より少し長めにして、万一のときに止まらず動き続けるのを防ぐ
    timeout-minutes: 90
    steps:
      - name: Ping /up until the cron window ends
        env:
          APP_URL: https://habitflow-web.onrender.com/up
          # どの schedule で起動したか（手動のときは空）。スクリプトに直接埋め込まず、環境変数で渡す
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          # どの時間帯の回かによって、起こし続ける終了時刻（UTC の時:分）を決める
          case "$TRIGGER_SCHEDULE" in
            "17 14 * * *") END_HHMM="15:10" ;;
            "23 18 * * *") END_HHMM="19:20" ;;
            "17 23 * * 0") END_HHMM="00:05" ;;
            *)             END_HHMM="" ;;  # 手動実行
          esac

          now=$(date -u +%s)
          if [ -z "$END_HHMM" ]; then
            # 手動実行のときは 20 分間だけ
            end=$((now + 20 * 60))
          else
            # 今日（UTC）の終了時刻
            end_today=$(date -u -d "$(date -u +%F) ${END_HHMM}" +%s)
            if [ "$end_today" -ge "$now" ]; then
              # まだ終了時刻の前 → 今日の終了時刻まで起こす
              end=$end_today
            elif [ $((now - end_today)) -lt 21600 ]; then
              # 終了時刻を過ぎている（GitHub Actions が大きく遅れた）→ 1 回だけアクセスして終わる
              end=$now
            else
              # ③ のように終了時刻が翌日（月曜 0:05）の場合
              end=$((end_today + 86400))
            fi
          fi
          echo "起こし続ける終了時刻: $(date -u -d "@$end" '+%F %H:%M') UTC"

          while :; do
            # 止まっているアプリは起動に 1 分前後かかるので、120 秒まで待つ
            # 起動中は 503 などが返ることもあるが、アクセスが届けば起動するので失敗扱いにはしない
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "$APP_URL" || echo "000")
            echo "$(date -u '+%H:%M:%S') UTC  /up -> ${code}"
            if [ "$(date -u +%s)" -ge "$end" ]; then
              break
            fi
            # 4 分おき（Render が止まるまでの 15 分より十分短い）
            sleep 240
          done